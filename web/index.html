<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Messer Lineup</title>
    <meta name="description" content="The artists you go see, in rooms near you. A board of gigs for the towns we index." />
    <meta name="color-scheme" content="light dark" />
    <!-- A link in a chat should arrive with the board's own face, not a grey rectangle. One card for the whole site:
         a per-board card is a Worker route, and a board is a URL a crawler does not fetch. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Messer Lineup" />
    <meta property="og:title" content="Messer Lineup — the artists you go see, in rooms near you" />
    <meta property="og:description" content="Four towns, one board, and a calendar that fills itself. No account, no session." />
    <meta property="og:url" content="https://lineup.messer.wtf/" />
    <meta property="og:image" content="https://lineup.messer.wtf/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Messer Lineup on a near-black card with a lime rule" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Messer Lineup" />
    <meta name="twitter:description" content="The artists you go see, in rooms near you. Four towns, one board." />
    <meta name="twitter:image" content="https://lineup.messer.wtf/og.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#08080a" />
    <script>
      // Pre-paint: the correct theme is on the element before the first frame, so neither theme flashes.
      (function () {
        try {
          var stored = localStorage.getItem("lineup.theme");
          var dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
