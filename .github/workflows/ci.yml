name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The board is a build product of its own: `make check` is Go only, so without this step a TypeScript
      # error reaches main and is only discovered by the deploy that has no dist to upload.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Board
        run: cd web && npm ci && npm run build

      - name: Gate
        run: make check

      - name: Build
        run: make build
